<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GEO 管理控制台</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f7;
      --panel: #fff;
      --line: #dfe5e8;
      --text: #17202a;
      --muted: #6f7b84;
      --green: #176b5b;
      --green-soft: #e8f4f0;
      --amber: #8a5d0a;
      --amber-soft: #fff3df;
      --red: #a13e2d;
      --red-soft: #fff0ed;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .shell { min-height: 100vh; display: grid; grid-template-columns: 220px minmax(0, 1fr); }
    aside { padding: 22px 16px; background: #18221f; color: #fff; }
    .brand { display: flex; gap: 10px; align-items: center; padding: 0 8px 22px; border-bottom: 1px solid rgba(255,255,255,.12); }
    .brand-mark { display: grid; width: 34px; height: 34px; place-items: center; border-radius: 7px; background: #2b8a75; font-weight: 900; }
    .brand strong, .brand span { display: block; }
    .brand span { margin-top: 2px; color: #a9bbb5; font-size: 11px; }
    nav { margin-top: 18px; }
    nav button { width: 100%; margin-bottom: 6px; padding: 10px 12px; border: 0; border-radius: 6px; background: transparent; color: #b8c7c2; text-align: left; font-weight: 700; }
    nav button.active { background: #263a34; color: #fff; }
    main { min-width: 0; padding: 24px 28px 48px; }
    .topbar { display: flex; gap: 18px; align-items: center; justify-content: space-between; }
    h1 { margin: 0; font-size: 24px; }
    .subtitle { margin-top: 4px; color: var(--muted); }
    .refresh { height: 36px; padding: 0 14px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: #34414a; font-weight: 800; }
    .top-actions { display: flex; gap: 8px; align-items: center; }
    .key-input { width: 190px; height: 36px; border: 1px solid var(--line); border-radius: 6px; background: #fff; padding: 0 10px; color: var(--text); }
    .identity { color: var(--muted); font-size: 11px; white-space: nowrap; }
    .action { height: 30px; padding: 0 9px; border: 1px solid var(--line); border-radius: 5px; background: #fff; color: #34414a; font-size: 11px; font-weight: 800; }
    .action.primary { border-color: var(--green); background: var(--green); color: #fff; }
    .form-row { display: grid; grid-template-columns: 1fr 2fr 1fr 1fr auto; gap: 8px; }
    .form-row input, .form-row select { min-width: 0; height: 36px; border: 1px solid var(--line); border-radius: 5px; padding: 0 9px; }
    .project-form { display: grid; grid-template-columns: 1fr 100px 2fr auto; gap: 8px; margin-top: 8px; }
    .project-form input { min-width: 0; height: 34px; border: 1px solid var(--line); border-radius: 5px; padding: 0 9px; }
    .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 22px; }
    .metric, .panel { border: 1px solid var(--line); border-radius: 7px; background: var(--panel); }
    .metric { padding: 16px; }
    .metric-label { color: var(--muted); font-size: 12px; font-weight: 800; }
    .metric-value { margin-top: 8px; font-size: 28px; font-weight: 900; }
    .metric-note { margin-top: 4px; color: var(--muted); font-size: 11px; }
    .grid { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(280px, 1fr); gap: 14px; margin-top: 14px; }
    .panel { min-width: 0; padding: 16px; }
    .panel-head { display: flex; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .panel-title { font-size: 15px; font-weight: 900; }
    .panel-meta { color: var(--muted); font-size: 11px; }
    .filters { display: flex; gap: 8px; }
    .filters input, .filters select { height: 34px; min-width: 0; border: 1px solid var(--line); border-radius: 5px; background: #fff; padding: 0 9px; color: var(--text); }
    .filters input { width: 190px; }
    .audit-filters { display: flex; gap: 8px; flex-wrap: wrap; }
    .audit-filters input, .audit-filters select { height: 34px; min-width: 0; border: 1px solid var(--line); border-radius: 5px; background: #fff; padding: 0 9px; color: var(--text); }
    .audit-filters input { width: 150px; }
    .table-wrap { overflow: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 8px; border-top: 1px solid #edf0f2; text-align: left; vertical-align: middle; }
    th { color: var(--muted); font-size: 11px; font-weight: 900; text-transform: uppercase; }
    tbody tr { cursor: pointer; }
    tbody tr:hover { background: #f7faf9; }
    .task-title { max-width: 280px; overflow: hidden; font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }
    .task-url { max-width: 280px; overflow: hidden; margin-top: 2px; color: var(--muted); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .badge { display: inline-flex; padding: 4px 7px; border-radius: 999px; background: #edf1f2; color: #58646c; font-size: 10px; font-weight: 900; }
    .badge.pending_review { background: var(--amber-soft); color: var(--amber); }
    .badge.approved, .badge.completed, .badge.retested, .badge.injected { background: var(--green-soft); color: var(--green); }
    .badge.failed, .badge.rejected { background: var(--red-soft); color: var(--red); }
    .score { color: var(--green); font-size: 18px; font-weight: 900; }
    .queue { display: grid; gap: 9px; }
    .queue-item { padding: 11px; border: 1px solid #e6eaed; border-radius: 6px; background: #fafbfb; }
    .queue-title { overflow: hidden; font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }
    .queue-meta { margin-top: 4px; color: var(--muted); font-size: 11px; }
    .empty { padding: 26px 8px; color: var(--muted); text-align: center; }
    dialog { width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 40px); padding: 0; border: 0; border-radius: 8px; box-shadow: 0 18px 60px rgba(15,25,21,.25); }
    dialog::backdrop { background: rgba(12,20,17,.42); }
    .dialog-head { position: sticky; top: 0; display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid var(--line); background: #fff; }
    .dialog-body { padding: 18px; overflow: auto; }
    .close { width: 30px; height: 30px; border: 1px solid var(--line); border-radius: 5px; background: #fff; font-size: 18px; }
    .detail-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
    .detail-item { padding: 11px; border-radius: 6px; background: #f4f7f6; }
    .detail-label { color: var(--muted); font-size: 10px; font-weight: 900; text-transform: uppercase; }
    .detail-value { margin-top: 5px; overflow-wrap: anywhere; font-weight: 800; }
    .section { margin-top: 18px; }
    .section h3 { margin: 0 0 8px; font-size: 13px; }
    .timeline { display: grid; gap: 7px; }
    .timeline-item { display: grid; grid-template-columns: 90px minmax(0, 1fr) auto; gap: 9px; padding: 9px 0; border-top: 1px solid #edf0f2; }
    .error { margin-top: 14px; padding: 10px; border: 1px solid #f0c6bd; border-radius: 6px; background: var(--red-soft); color: var(--red); }
    [hidden] { display: none !important; }
    @media (max-width: 980px) {
      .shell { grid-template-columns: 1fr; }
      aside { display: none; }
      main { padding: 18px; }
      .metrics { grid-template-columns: repeat(2, 1fr); }
      .grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 600px) {
      .metrics, .detail-grid { grid-template-columns: 1fr; }
      .topbar, .panel-head { align-items: flex-start; flex-direction: column; }
      .top-actions { width: 100%; flex-wrap: wrap; }
      .key-input { flex: 1; min-width: 180px; }
      .filters { width: 100%; }
      .filters input, .filters select { flex: 1; width: auto; }
      th:nth-child(n+4), td:nth-child(n+4) { display: none; }
      .task-title, .task-url { max-width: 180px; }
      .form-row { grid-template-columns: 1fr; }
      .project-form { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside>
      <div class="brand"><div class="brand-mark">G</div><div><strong>GEO Growth OS</strong><span>运营管理控制台</span></div></div>
      <nav><button class="active" data-status="">总览</button><button data-status="">任务</button><button data-status="pending_review">审核队列</button><button data-status="injected">交付记录</button><button data-status="retested">复测记录</button></nav>
    </aside>
    <main>
      <header class="topbar">
        <div><h1>运营总览</h1><div class="subtitle">监控 GEO 任务从诊断到复测的完整状态</div></div>
        <div class="top-actions"><span class="identity" id="identity">本地开发身份</span><input class="key-input" id="apiKey" type="password" placeholder="生产环境 API Key"><button class="refresh" id="saveKey">应用密钥</button><button class="refresh" id="refresh">刷新数据</button></div>
      </header>
      <div id="error" class="error" hidden></div>
      <section class="metrics" id="metrics"></section>
      <section class="grid">
        <div class="panel">
          <div class="panel-head">
            <div><div class="panel-title">任务工作台</div><div class="panel-meta" id="taskCount"></div></div>
            <div class="filters"><input id="query" placeholder="搜索任务、网址"><select id="status"><option value="">全部状态</option></select></div>
          </div>
          <div class="table-wrap"><table><thead><tr><th>项目</th><th>负责人</th><th>阶段</th><th>评分/目标</th><th>下一步</th><th>效果</th></tr></thead><tbody id="taskRows"></tbody></table></div>
        </div>
        <div class="panel">
          <div class="panel-head"><div><div class="panel-title">需要关注</div><div class="panel-meta">优先处理阻塞闭环的问题</div></div></div>
          <div class="queue" id="attention"></div>
        </div>
      </section>
      <section class="panel" style="margin-top:14px">
        <div class="panel-head"><div><div class="panel-title">最近操作审计</div><div class="panel-meta">关键业务动作与执行结果</div></div><div class="audit-filters"><input id="auditActor" placeholder="筛选执行者"><select id="auditAction"><option value="">全部动作</option></select><select id="auditOutcome"><option value="">全部结果</option><option value="success">success</option><option value="completed">completed</option><option value="failed">failed</option><option value="approved">approved</option><option value="rejected">rejected</option></select></div></div>
        <div class="table-wrap"><table><thead><tr><th>时间</th><th>执行者</th><th>动作</th><th>对象</th><th>结果</th></tr></thead><tbody id="auditRows"></tbody></table></div>
      </section>
      <section class="panel" style="margin-top:14px">
        <div class="panel-head"><div><div class="panel-title">CMS 发布目标</div><div class="panel-meta">凭证使用环境变量引用，不在数据库保存明文</div></div></div>
        <div class="form-row"><input id="cmsName" placeholder="目标名称"><input id="cmsUrl" placeholder="https://cms.example.com/publish"><select id="cmsEnv"><option>staging</option><option>production</option></select><input id="cmsSecretEnv" placeholder="凭证环境变量（可选）"><button class="refresh" id="saveCms">保存目标</button></div>
        <div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>名称</th><th>环境</th><th>地址</th><th>凭证</th><th>状态</th></tr></thead><tbody id="cmsRows"></tbody></table></div>
      </section>
      <section class="grid">
        <div class="panel">
          <div class="panel-head"><div><div class="panel-title">品牌知识库</div><div class="panel-meta">用于分析与改写时的品牌事实约束</div></div></div>
          <div class="form-row"><input id="kbBrand" placeholder="品牌名"><input id="kbTitle" placeholder="知识标题"><input id="kbCategory" placeholder="分类"><input id="kbSource" placeholder="来源"><button class="refresh" id="saveKb">保存</button></div>
          <div style="margin-top:8px"><input id="kbContent" placeholder="知识内容，建议包含定位、禁用说法、关键事实" style="width:100%;height:36px;border:1px solid var(--line);border-radius:5px;padding:0 9px"></div>
          <div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>品牌</th><th>分类</th><th>标题</th><th>状态</th></tr></thead><tbody id="kbRows"></tbody></table></div>
        </div>
        <div class="panel">
          <div class="panel-head"><div><div class="panel-title">AI 调用日志</div><div class="panel-meta">分析、改写、FAQ 与失败回退记录</div></div></div>
          <div class="table-wrap"><table><thead><tr><th>时间</th><th>动作</th><th>提供方</th><th>状态</th><th>任务</th></tr></thead><tbody id="llmRows"></tbody></table></div>
        </div>
      </section>
      <section class="panel" style="margin-top:14px">
        <div class="panel-head"><div><div class="panel-title">异步任务</div><div class="panel-meta">定时复测、失败重试与执行状态</div></div><div class="filters"><select id="jobStatus"><option value="">全部状态</option><option>queued</option><option>running</option><option>retry_wait</option><option>completed</option><option>failed</option></select><button class="refresh" id="runDue">运行到期任务</button></div></div>
        <div class="table-wrap"><table><thead><tr><th>任务</th><th>状态</th><th>计划时间</th><th>尝试</th><th>错误</th><th>操作</th></tr></thead><tbody id="jobRows"></tbody></table></div>
      </section>
    </main>
  </div>
  <dialog id="detailDialog">
    <div class="dialog-head"><strong id="detailTitle">任务详情</strong><button class="close" id="closeDialog" aria-label="关闭">×</button></div>
    <div class="dialog-body" id="detailBody"></div>
  </dialog>
  <script>
    const $ = (id) => document.getElementById(id);
    let overview = null;
    let audit = null;
    let jobs = null;
    let cmsTargets = [];
    let knowledgeItems = [];
    let llmLogs = [];
    let apiKey = sessionStorage.getItem("geoApiKey") || "";
    const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[char]));
    const badge = (status) => `<span class="badge ${escapeHtml(status)}">${escapeHtml(status || "unknown")}</span>`;
    const formatTime = (value) => value ? new Date(value).toLocaleString("zh-CN", {hour12:false}) : "-";
    async function api(path, options = {}) {
      const headers = apiKey ? {"Authorization": `Bearer ${apiKey}`} : {};
      const response = await fetch(path, {...options, headers: {...headers, ...(options.headers || {})}});
      const actor = response.headers.get("X-GEO-Actor");
      const role = response.headers.get("X-GEO-Role");
      if (actor && role) $("identity").textContent = `${actor} · ${role}`;
      if (!response.ok) throw new Error((await response.json()).detail || `请求失败 ${response.status}`);
      return response.json();
    }
    function renderMetrics(metrics) {
      const items = [
        ["任务总数", metrics.tasks, `平均评分 ${metrics.average_score}`],
        ["待审核", metrics.pending_reviews, "等待人工确认"],
        ["完成交付", metrics.completed_injections, `失败 ${metrics.failed_injections}`],
        ["复测记录", metrics.retests, `平均变化 ${metrics.average_delta > 0 ? "+" : ""}${metrics.average_delta}`]
      ];
      $("metrics").innerHTML = items.map(([label,value,note]) => `<article class="metric"><div class="metric-label">${label}</div><div class="metric-value">${value}</div><div class="metric-note">${note}</div></article>`).join("");
    }
    function renderTasks(tasks) {
      $("taskCount").textContent = `${tasks.length} 个任务`;
      $("taskRows").innerHTML = tasks.length ? tasks.map((task) => `<tr data-task="${escapeHtml(task.task_id)}"><td><div class="task-title">${escapeHtml(task.title)}</div><div class="task-url">${escapeHtml(task.url)}</div></td><td>${escapeHtml(task.owner)}</td><td>${badge(task.status)}</td><td><span class="score">${task.geo_score}</span>/${task.target_score}</td><td>${escapeHtml(task.next_action)}</td><td>${escapeHtml(task.effectiveness)}</td></tr>`).join("") : `<tr><td colspan="6" class="empty">没有符合条件的项目</td></tr>`;
      document.querySelectorAll("[data-task]").forEach((row) => row.addEventListener("click", () => showTask(row.dataset.task)));
    }
    function renderAttention(attention) {
      const groups = [
        ["待审核版本", attention.pending_reviews, "version_id", "status"],
        ["失败交付", attention.failed_injections, "version_id", "response_summary"],
        ["质量阻断", attention.blocked_versions || [], "version_id", "status"],
        ["发布失败", attention.failed_publications || [], "publication_id", "response_summary"],
        ["复测未提升", attention.needs_more_work, "title", "score_delta"]
      ];
      const items = groups.flatMap(([label, list, titleKey, metaKey]) => list.map((item) => `<div class="queue-item"><div class="queue-title">${label} · ${escapeHtml(item[titleKey])}</div><div class="queue-meta">${escapeHtml(item[metaKey])}</div></div>`));
      $("attention").innerHTML = items.length ? items.join("") : `<div class="empty">当前没有阻塞项</div>`;
    }
    function renderAudit(items) {
      $("auditRows").innerHTML = items.length ? items.map((item) => `<tr><td>${formatTime(item.created_at)}</td><td>${escapeHtml(item.actor)}</td><td><strong>${escapeHtml(item.action)}</strong></td><td><div class="task-title">${escapeHtml(item.entity_id)}</div><div class="task-url">${escapeHtml(item.task_id || item.entity_type)}</div></td><td>${badge(item.outcome)}</td></tr>`).join("") : `<tr><td colspan="5" class="empty">暂无操作记录</td></tr>`;
    }
    function populateAuditFilters(items) {
      const actions = [...new Set(items.map((item) => item.action).filter(Boolean))];
      const current = $("auditAction").value;
      $("auditAction").innerHTML = `<option value="">全部动作</option>` + actions.map((action) => `<option value="${escapeHtml(action)}">${escapeHtml(action)}</option>`).join("");
      $("auditAction").value = actions.includes(current) ? current : "";
    }
    function renderJobs(items) {
      $("jobRows").innerHTML = items.length ? items.map((item) => `<tr><td><div class="task-title">${escapeHtml(item.job_type)}</div><div class="task-url">${escapeHtml(item.job_id)}</div></td><td>${badge(item.status)}</td><td>${formatTime(item.run_at)}</td><td>${item.attempts}/${item.max_attempts}</td><td><div class="task-url">${escapeHtml(item.last_error || "-")}</div></td><td>${["failed","retry_wait"].includes(item.status) ? `<button class="action" data-retry-job="${escapeHtml(item.job_id)}">重试</button>` : "-"}</td></tr>`).join("") : `<tr><td colspan="6" class="empty">暂无异步任务</td></tr>`;
      document.querySelectorAll("[data-retry-job]").forEach((button) => button.addEventListener("click", async () => {
        try {
          await api(`/admin/api/jobs/${encodeURIComponent(button.dataset.retryJob)}/retry`, {method:"POST"});
          await loadJobs();
        } catch (error) {
          $("error").textContent = error.message;
          $("error").hidden = false;
        }
      }));
    }
    async function loadJobs() {
      const status = $("jobStatus").value;
      jobs = await api(`/admin/api/jobs?limit=50&status=${encodeURIComponent(status)}`);
      renderJobs(jobs.items);
    }
    function renderCmsTargets(items) {
      $("cmsRows").innerHTML = items.length ? items.map((item) => `<tr><td><strong>${escapeHtml(item.name)}</strong></td><td>${escapeHtml(item.environment)}</td><td><div class="task-url">${escapeHtml(item.webhook_url)}</div></td><td>${item.auth_env_var ? `${escapeHtml(item.auth_env_var)} · ${item.credential_configured ? "已配置" : "待配置"}` : "无需凭证"}</td><td>${badge(item.enabled ? "enabled" : "disabled")}</td></tr>`).join("") : `<tr><td colspan="5" class="empty">尚未配置 CMS 发布目标</td></tr>`;
    }
    async function loadCmsTargets() {
      const result = await api("/cms/targets");
      cmsTargets = result.items;
      renderCmsTargets(cmsTargets);
    }
    function renderKnowledge(items) {
      $("kbRows").innerHTML = items.length ? items.map((item) => `<tr><td>${escapeHtml(item.brand)}</td><td>${escapeHtml(item.category)}</td><td><div class="task-title">${escapeHtml(item.title)}</div><div class="task-url">${escapeHtml(item.content)}</div></td><td>${badge(item.status)}</td></tr>`).join("") : `<tr><td colspan="4" class="empty">暂无品牌知识</td></tr>`;
    }
    async function loadKnowledge() {
      const result = await api("/admin/api/knowledge?limit=20");
      knowledgeItems = result.items;
      renderKnowledge(knowledgeItems);
    }
    function renderLlmLogs(items) {
      $("llmRows").innerHTML = items.length ? items.map((item) => `<tr><td>${formatTime(item.created_at)}</td><td><strong>${escapeHtml(item.action)}</strong></td><td>${escapeHtml(item.provider)}<div class="task-url">${escapeHtml(item.model || "-")}</div></td><td>${badge(item.status)}</td><td><div class="task-title">${escapeHtml(item.task_id || "-")}</div><div class="task-url">${escapeHtml(item.error_message || item.response_excerpt || "-")}</div></td></tr>`).join("") : `<tr><td colspan="5" class="empty">暂无 AI 调用日志</td></tr>`;
    }
    async function loadLlmLogs() {
      const result = await api("/admin/api/llm-logs?limit=20");
      llmLogs = result.items;
      renderLlmLogs(llmLogs);
    }
    async function loadAudit() {
      const params = new URLSearchParams({limit: "20"});
      const actor = $("auditActor").value.trim();
      const action = $("auditAction").value;
      const outcome = $("auditOutcome").value;
      if (actor) params.set("actor", actor);
      if (action) params.set("action", action);
      if (outcome) params.set("outcome", outcome);
      audit = await api(`/admin/api/audit-logs?${params.toString()}`);
      renderAudit(audit.items);
      populateAuditFilters(audit.items);
    }
    async function applyFilters() {
      const query = $("query").value.trim().toLowerCase();
      const status = $("status").value;
      try {
        const result = await api(`/admin/api/tasks?limit=200&status=${encodeURIComponent(status)}&q=${encodeURIComponent(query)}`);
        renderTasks(result.items);
      } catch (error) {
        $("error").textContent = error.message;
        $("error").hidden = false;
      }
    }
    async function load() {
      $("error").hidden = true;
      try {
        [overview] = await Promise.all([api("/admin/api/overview"), loadAudit(), loadJobs(), loadCmsTargets(), loadKnowledge(), loadLlmLogs()]);
        renderMetrics(overview.metrics);
        renderTasks(overview.recent_tasks);
        renderAttention(overview.attention);
        const statuses = [...new Set(["analyzed", "draft_ready", "pending_review", "approved", "injected", "retested", ...Object.keys(overview.status_counts)])];
        $("status").innerHTML = `<option value="">全部状态</option>` + statuses.map((status) => `<option>${escapeHtml(status)}</option>`).join("");
      } catch (error) {
        $("error").textContent = error.message;
        $("error").hidden = false;
      }
    }
    async function showTask(taskId) {
      try {
        const detail = await api(`/admin/api/tasks/${encodeURIComponent(taskId)}`);
        const task = detail.task;
        $("detailTitle").textContent = task.title || task.task_id;
        const summary = [
          ["任务 ID", task.task_id], ["状态", task.status], ["网址", task.url],
          ["负责人", detail.project?.owner || "待分配"], ["评分目标", `${task.latest_result?.geo_score ?? 0}/${detail.project?.target_score || 80}`], ["下一步", detail.project?.next_action || "-"]
        ];
        const timelines = [
          ["版本", detail.versions, "version_id", "status", "updated_at"],
          ["交付", detail.injections, "injection_id", "status", "completed_at"],
          ["复测", detail.retests, "injection_id", "status", "created_at"],
          ["审计", detail.audit_logs, "action", "outcome", "created_at"]
        ];
        const version = detail.versions[0];
        const pendingPublication = (detail.publications || []).find((item) => item.status === "pending_confirmation");
        const failedPublication = (detail.publications || []).find((item) => item.status === "failed");
        const publishedPublication = (detail.publications || []).find((item) => ["published","verification_failed"].includes(item.status));
        const actions = `<section class="section"><h3>项目设置</h3><div class="project-form"><input id="projectOwner" placeholder="负责人" value="${escapeHtml(detail.project?.owner === "待分配" ? "" : detail.project?.owner)}"><input id="projectTarget" type="number" min="1" max="100" value="${detail.project?.target_score || 80}"><input id="projectTodos" placeholder="待办事项，用逗号分隔" value="${escapeHtml((detail.project?.todos || []).join(","))}"><button class="action" id="saveProject">保存项目</button></div></section><section class="section"><h3>运营操作</h3><div class="filters">${version ? `<button class="action" data-quality="${escapeHtml(version.version_id)}">质量检查</button>` : ""}${version?.status === "pending_review" && version?.quality_report?.status === "passed" ? `<button class="action primary" data-approve="${escapeHtml(version.version_id)}">审核通过</button>` : ""}${version?.status === "approved" && cmsTargets.length ? `<button class="action primary" data-preview="${escapeHtml(version.version_id)}">创建发布预览</button>` : ""}${pendingPublication ? `<button class="action primary" data-publish="${escapeHtml(pendingPublication.publication_id)}">确认发布</button>` : ""}${failedPublication ? `<button class="action" data-retry-publish="${escapeHtml(failedPublication.publication_id)}">重试发布</button>` : ""}${publishedPublication ? `<button class="action" data-verify-publish="${escapeHtml(publishedPublication.publication_id)}">上线校验</button>` : ""}</div></section>`;
        const publicationTimeline = [["发布", detail.publications || [], "publication_id", "status", "updated_at"]];
        $("detailBody").innerHTML = `<div class="detail-grid">${summary.map(([label,value]) => `<div class="detail-item"><div class="detail-label">${label}</div><div class="detail-value">${escapeHtml(value)}</div></div>`).join("")}</div>${actions}` + [...timelines, ...publicationTimeline].map(([label,items,titleKey,statusKey,timeKey]) => `<section class="section"><h3>${label}记录</h3><div class="timeline">${items.length ? items.map((item) => `<div class="timeline-item"><strong>${label}</strong><span>${escapeHtml(item[titleKey] || "-")}</span><span>${badge(item[statusKey])}<br><small>${formatTime(item[timeKey])}</small></span></div>`).join("") : `<div class="empty">暂无${label}记录</div>`}</div></section>`).join("");
        document.querySelector("[data-quality]")?.addEventListener("click", async (event) => { await api(`/geo/versions/${event.target.dataset.quality}/quality-check`, {method:"POST"}); $("detailDialog").close(); await showTask(taskId); });
        document.querySelector("[data-approve]")?.addEventListener("click", async (event) => { await api("/geo/version/review", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({version_id:event.target.dataset.approve, action:"approve"})}); $("detailDialog").close(); await showTask(taskId); await load(); });
        document.querySelector("[data-preview]")?.addEventListener("click", async (event) => { await api("/cms/publications/preview", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({version_id:event.target.dataset.preview, target_id:cmsTargets[0].target_id})}); $("detailDialog").close(); await showTask(taskId); });
        document.querySelector("[data-publish]")?.addEventListener("click", async (event) => { if (!confirm("确认将已审核版本发布到 CMS？")) return; await api("/cms/publications/confirm", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({publication_id:event.target.dataset.publish, confirmation:"PUBLISH"})}); $("detailDialog").close(); await showTask(taskId); await load(); });
        document.querySelector("[data-retry-publish]")?.addEventListener("click", async (event) => { await api(`/cms/publications/${event.target.dataset.retryPublish}/retry`, {method:"POST"}); $("detailDialog").close(); await showTask(taskId); });
        document.querySelector("[data-verify-publish]")?.addEventListener("click", async (event) => { await api("/cms/publications/verify", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({publication_id:event.target.dataset.verifyPublish})}); $("detailDialog").close(); await showTask(taskId); await load(); });
        $("saveProject").addEventListener("click", async () => { await api(`/geo/projects/${encodeURIComponent(taskId)}`, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({owner:$("projectOwner").value, target_score:Number($("projectTarget").value), todos:$("projectTodos").value.split(",").map((item) => item.trim()).filter(Boolean)})}); $("detailDialog").close(); await showTask(taskId); await load(); });
        $("detailDialog").showModal();
      } catch (error) {
        $("error").textContent = error.message;
        $("error").hidden = false;
      }
    }
    $("refresh").addEventListener("click", load);
    $("apiKey").value = apiKey;
    $("saveKey").addEventListener("click", () => {
      apiKey = $("apiKey").value.trim();
      if (apiKey) sessionStorage.setItem("geoApiKey", apiKey);
      else sessionStorage.removeItem("geoApiKey");
      load();
    });
    $("query").addEventListener("input", applyFilters);
    $("status").addEventListener("change", applyFilters);
    $("auditActor").addEventListener("input", loadAudit);
    $("auditAction").addEventListener("change", loadAudit);
    $("auditOutcome").addEventListener("change", loadAudit);
    $("jobStatus").addEventListener("change", loadJobs);
    $("runDue").addEventListener("click", async () => {
      try {
        await api("/admin/api/jobs/run-due", {method:"POST"});
        await Promise.all([loadJobs(), loadAudit()]);
      } catch (error) {
        $("error").textContent = error.message;
        $("error").hidden = false;
      }
    });
    $("saveCms").addEventListener("click", async () => {
      try {
        await api("/cms/targets", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({name:$("cmsName").value, webhook_url:$("cmsUrl").value, environment:$("cmsEnv").value, auth_env_var:$("cmsSecretEnv").value || null})});
        $("cmsName").value = ""; $("cmsUrl").value = ""; $("cmsSecretEnv").value = "";
        await loadCmsTargets();
      } catch (error) { $("error").textContent = error.message; $("error").hidden = false; }
    });
    $("saveKb").addEventListener("click", async () => {
      try {
        await api("/geo/knowledge", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({brand:$("kbBrand").value, title:$("kbTitle").value, category:$("kbCategory").value || "positioning", source:$("kbSource").value || null, content:$("kbContent").value, status:"approved"})});
        $("kbBrand").value = ""; $("kbTitle").value = ""; $("kbCategory").value = ""; $("kbSource").value = ""; $("kbContent").value = "";
        await loadKnowledge();
      } catch (error) { $("error").textContent = error.message; $("error").hidden = false; }
    });
    $("closeDialog").addEventListener("click", () => $("detailDialog").close());
    document.querySelectorAll("nav button").forEach((button) => button.addEventListener("click", () => {
      document.querySelectorAll("nav button").forEach((item) => item.classList.toggle("active", item === button));
      $("status").value = button.dataset.status;
      applyFilters();
      document.querySelector(".panel").scrollIntoView({behavior:"smooth", block:"start"});
    }));
    load();
  </script>
</body>
</html>
